<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directed: /gens empty state (showcase skill applied)</title>
<style>
  /* Skill-applied result. Direction picked: "wall of fame, currently vacant"
     (direction B of three; see ../showcase-skill.md for the full run).
     THESIS: an empty gallery wall with paper squares already taped up -
     emptiness rendered as reserved space, not absence.
     NOT: a sad-face apology; NOT a dashboard placeholder card; NOT a
     mascot cartoon doing the work the user's gens should do.
     STAR of this surface: the vacant wall itself, stamped NO CURSES YET.
     SURPRISE (separable: delete .reserved-note): slot 1 carries a taped
     handwritten note reserving it for the first gen.
     DNA citations: hard offset shadow + "no soft glow" (index.css --shadow
     comment), wobble radii + marker/hand faces (DESIGN.md tokens), red
     stamp + taped-paper + dashed-border vocabulary (captain gold sample,
     tear-zone reference). Fallback faces stand in for the site's
     self-hosted woff2 in this standalone mock. */
  :root {
    --bg: #0b0a09; --fg: #f4f1e8; --fg-dim: rgba(244, 241, 232, 0.75);
    --primary: #e8352a; --ink: #0a0a0a; --paper: #f4efe3;
    --hand: 'Patrick Hand', 'Bradley Hand', 'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive;
    --marker: 'Permanent Marker', 'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--hand);
    min-height: 100svh; display: grid; place-items: center; padding: 40px 24px;
  }
  .wall { max-width: 760px; width: 100%; }
  .eyebrow {
    font-size: 11px; font-weight: 800; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--fg-dim);
  }
  h1 {
    font-family: var(--marker); font-weight: 400; line-height: 0.94;
    font-size: clamp(40px, 7vw, 72px); margin: 10px 0 6px;
  }
  .sub { font-size: 18px; color: var(--fg-dim); max-width: 46ch; }
  .frames-wall { position: relative; margin-top: 36px; }
  .frames {
    display: grid; gap: 18px;
    grid-template-columns: repeat(4, 1fr); list-style: none; padding: 0;
  }
  .frame {
    aspect-ratio: 1; border: 3px dashed rgba(244, 241, 232, 0.35);
    border-radius: 14px 5px 16px 6px / 6px 15px 5px 17px;
    position: relative; transform: rotate(var(--tilt, 0deg));
  }
  .frame::before {
    /* a strip of tape on each waiting frame */
    content: ""; position: absolute; top: -10px; left: 50%; width: 52px;
    height: 16px; transform: translateX(-50%) rotate(-3deg);
    background: rgba(244, 239, 227, 0.28);
  }
  .stamp {
    position: absolute; inset: 0; margin: auto; width: max-content;
    height: max-content; padding: 8px 18px; transform: rotate(-7deg);
    border: 4px solid var(--primary); color: var(--primary);
    font-family: var(--marker); font-size: clamp(26px, 4.5vw, 44px);
    letter-spacing: 0.04em; background: rgba(11, 10, 9, 0.82);
    box-shadow: 5px 6px 0 rgba(232, 53, 42, 0.35);
  }
  /* SURPRISE - one, flagged, separable: remove this block and its <span> note */
  .reserved-note {
    position: absolute; inset: 12% 10% auto 10%; padding: 10px 12px;
    background: var(--paper); color: #191510; font-size: 15px;
    line-height: 1.25; transform: rotate(2.5deg);
    box-shadow: 4px 4px 0 rgba(232, 53, 42, 0.85);
    transition: transform 150ms cubic-bezier(0.34, 1.15, 0.64, 1);
  }
  .frame:hover .reserved-note { transform: rotate(-1deg) translateY(-2px); }
  @media (prefers-reduced-motion: reduce) {
    .frame:hover .reserved-note { transform: rotate(2.5deg); }
  }
  .actions { margin-top: 36px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .cta {
    display: inline-block; background: var(--primary); color: var(--ink);
    font-family: var(--hand); font-weight: 800; font-size: 17px;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 12px 22px;
    border: 3px solid var(--ink); text-decoration: none;
    border-radius: 14px 5px 16px 6px / 6px 15px 5px 17px;
    box-shadow: 5px 6px 0 rgba(232, 53, 42, 0.85);
  }
  .cta:hover { transform: translateY(-2px); }
  .aside { font-size: 14px; color: var(--fg-dim); }
</style>
</head>
<body>
  <main class="wall">
    <p class="eyebrow">Owner archive</p>
    <h1>The wall is up.</h1>
    <p class="sub">Eight frames, zero curses. Everything you make gets taped here, newest first, until it rots.</p>
    <div class="frames-wall">
      <ul class="frames" aria-label="Empty archive wall, eight waiting frames">
        <li class="frame" style="--tilt:-0.8deg">
          <span class="reserved-note" aria-hidden="true">reserved for your first curse</span>
        </li>
        <li class="frame" style="--tilt:0.55deg"></li>
        <li class="frame" style="--tilt:-0.35deg"></li>
        <li class="frame" style="--tilt:0.75deg"></li>
        <li class="frame" style="--tilt:0.4deg"></li>
        <li class="frame" style="--tilt:-0.6deg"></li>
        <li class="frame" style="--tilt:0.7deg"></li>
        <li class="frame" style="--tilt:-0.45deg"></li>
      </ul>
      <span class="stamp" aria-hidden="true">NO CURSES YET</span>
    </div>
    <div class="actions">
      <a class="cta" href="#make">Make the first one</a>
      <p class="aside">Reading the wall never signs a transaction.</p>
    </div>
  </main>
</body>
</html>
